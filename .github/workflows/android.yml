name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read app version
        id: version
        # Also fails the build early if CHANGELOG.md has no notes for this version.
        run: |
          v="$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          scripts/release-notes.sh "$v" > /dev/null
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The release key is never committed: the SIGNING_BUNDLE secret holds it (a base64 .tar.gz of
      # release.jks and release.properties). Without it (e.g. pull requests from forks), the release
      # APK is built unsigned and nothing is published.
      - name: Unpack the release key
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          if [ -n "$SIGNING_BUNDLE" ]; then
            printf '%s' "$SIGNING_BUNDLE" | base64 -d | tar -xz -C app/signing release.jks release.properties
          else
            echo "::warning::No SIGNING_BUNDLE secret, so the release APK is unsigned"
          fi

      - name: Test and build release APK
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Check the release signature
        id: sign
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then echo "::error::No apksigner under $sdk/build-tools"; exit 1; fi
          echo "Using $apksigner"
          if ! out="$("$apksigner" verify --print-certs "$apk" 2>&1)"; then
            echo "$out"
            echo "::error::apksigner couldn't verify the release APK: $(printf '%s' "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          got="$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          want="$(tr -d ' \n' < app/signing/release-cert.sha256)"
          if [ "$got" != "$want" ]; then
            echo "$out"
            echo "::error::The release APK is signed with an unexpected key (SHA-256 '$got'): $(printf '%s' "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Release APK signed with the release key (SHA-256 $got)"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish without the release key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Add the SIGNING_BUNDLE secret (Settings > Secrets and variables > Actions) to publish releases"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: comixium-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release for this version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          test -n "$VERSION"
          APK="comixium-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # The old rolling release from before releases were versioned.
          gh release delete latest --yes --cleanup-tag || true
          # A merge that doesn't bump the version rebuilds that version's release on the new commit.
          gh release delete "v${VERSION}" --yes --cleanup-tag || true
          scripts/release-notes.sh "$VERSION" "$GITHUB_SHA" > notes.md
          gh release create "v${VERSION}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Comixium ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Sync notes of earlier releases with CHANGELOG.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          for v in $(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md); do
            [ "$v" = "$VERSION" ] && continue
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${v}" --jq .object.sha 2>/dev/null)" || continue
            scripts/release-notes.sh "$v" "$sha" > "notes-${v}.md"
            gh release edit "v${v}" --notes-file "notes-${v}.md"
          done
