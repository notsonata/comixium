name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: comixium-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk comixium.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest comixium.apk \
            --title "Comixium (latest main)" \
            --notes "Automatic build of ${GITHUB_SHA}. Install comixium.apk; it updates in place over earlier builds."
