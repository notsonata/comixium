name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        # Also fails the build early if CHANGELOG.md has no notes for this version.
        run: |
          v="$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          scripts/release-notes.sh "$v" > /dev/null
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: comixium-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release for this version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          test -n "$VERSION"
          APK="comixium-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # The old rolling release from before releases were versioned.
          gh release delete latest --yes --cleanup-tag || true
          # A merge that doesn't bump the version rebuilds that version's release on the new commit.
          gh release delete "v${VERSION}" --yes --cleanup-tag || true
          scripts/release-notes.sh "$VERSION" "$GITHUB_SHA" > notes.md
          gh release create "v${VERSION}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Comixium ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Sync notes of earlier releases with CHANGELOG.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          for v in $(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md); do
            [ "$v" = "$VERSION" ] && continue
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${v}" --jq .object.sha 2>/dev/null)" || continue
            scripts/release-notes.sh "$v" "$sha" > "notes-${v}.md"
            gh release edit "v${v}" --notes-file "notes-${v}.md"
          done
